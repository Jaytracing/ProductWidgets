<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Image Slideshow</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

.slideshow {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 240px;
    overflow: hidden;
    background: #111;
    touch-action: pan-y;
    user-select: none;
}

.slideshow-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.25s ease;
}

.slideshow-image.loaded {
    opacity: 1;
}

.nav-button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    color: white;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    transition: background .2s, transform .2s;
}

.nav-button:hover {
    background: rgba(0,0,0,.75);
}

.nav-button:active {
    transform: translateY(-50%) scale(.94);
}

.previous {
    left: 16px;
}

.next {
    right: 16px;
}

.controls {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 13px;
    border-radius: 999px;
    background: rgba(0,0,0,.55);
    color: white;
    backdrop-filter: blur(6px);
}

.play-button {
    border: 0;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 18px;
    padding: 0 2px;
}

.counter {
    font-size: 13px;
    white-space: nowrap;
}

.status {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: white;
    background: #111;
}

.status.hidden {
    display: none;
}

.dots {
    position: absolute;
    left: 50%;
    bottom: 58px;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 6px;
    max-width: calc(100% - 120px);
    overflow: hidden;
}

.dot {
    width: 7px;
    height: 7px;
    flex: 0 0 7px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    cursor: pointer;
    padding: 0;
}

.dot.active {
    background: white;
}

@media (max-width: 600px) {
    .nav-button {
        width: 40px;
        height: 40px;
        font-size: 24px;
    }

    .previous {
        left: 10px;
    }

    .next {
        right: 10px;
    }

    .controls {
        bottom: 10px;
    }

    .dots {
        bottom: 51px;
    }
}
</style>
</head>

<body>

<div class="slideshow" id="slideshow">
    <div class="status" id="status">Loading images…</div>

    <img class="slideshow-image" id="slideshowImage" alt="Slideshow image">

    <button class="nav-button previous" id="previous" type="button"
            aria-label="Previous image">‹</button>

    <button class="nav-button next" id="next" type="button"
            aria-label="Next image">›</button>

    <div class="dots" id="dots"></div>

    <div class="controls">
        <button class="play-button" id="playButton" type="button"
                aria-label="Pause slideshow">❚❚</button>
        <span class="counter" id="counter">0 / 0</span>
    </div>
</div>

<script>
/*
    GitHub folder structure:

    widgets/
    └── slideshow/
        ├── index.html
        └── images/
            ├── image-01.jpg
            ├── image-02.jpg
            └── image-03.jpg

    This file automatically works when copied into another folder
    containing its own "images" subfolder.

    It expects the page to be hosted on GitHub Pages, for example:
    https://username.github.io/my-repo/widgets/slideshow/

    No repository name, owner, or image filenames need to be configured.
*/

const CONFIG = {
    imageFolder: "images",
    slideDuration: 5000,
    autoPlay: true,
    supportedExtensions: [
        ".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif"
    ]
};

const slideshow = document.getElementById("slideshow");
const imageElement = document.getElementById("slideshowImage");
const statusElement = document.getElementById("status");
const previousButton = document.getElementById("previous");
const nextButton = document.getElementById("next");
const playButton = document.getElementById("playButton");
const counter = document.getElementById("counter");
const dots = document.getElementById("dots");

let images = [];
let currentIndex = 0;
let timer = null;
let playing = CONFIG.autoPlay;
let touchStartX = null;


/*
    Determine the GitHub repository and branch from the GitHub Pages URL.

    Example:
    https://username.github.io/my-repo/widgets/slideshow/

    becomes:
    owner = username
    repo  = my-repo
    branch = main
*/
function getGitHubContext() {
    const hostname = window.location.hostname;
    const pathname = window.location.pathname;

    if (!hostname.endsWith(".github.io")) {
        return null;
    }

    const owner = hostname.split(".")[0];
    const parts = pathname.split("/").filter(Boolean);

    if (parts.length === 0) {
        return null;
    }

    const repo = parts[0];

    // Find the path to this widget relative to the repository.
    // The current page is expected to end in /index.html or /.
    let widgetPath = parts.slice(1);

    if (widgetPath[widgetPath.length - 1] === "index.html") {
        widgetPath.pop();
    }

    const imagePath = [...widgetPath, CONFIG.imageFolder]
        .map(encodeURIComponent)
        .join("/");

    return {
        owner,
        repo,
        branch: "main",
        imagePath
    };
}


/*
    Ask GitHub for the contents of this widget's images folder.
    GitHub's contents endpoint returns directory entries, which lets
    the slideshow discover images without maintaining a filename list.
*/
async function loadImagesFromGitHub() {
    const context = getGitHubContext();

    if (!context) {
        throw new Error(
            "This slideshow must be hosted through GitHub Pages."
        );
    }

    const apiUrl =
        `https://api.github.com/repos/${encodeURIComponent(context.owner)}` +
        `/${encodeURIComponent(context.repo)}/contents/${context.imagePath}` +
        `?ref=${encodeURIComponent(context.branch)}`;

    const response = await fetch(apiUrl, {
        headers: {
            "Accept": "application/vnd.github+json"
        },
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            `GitHub returned ${response.status}. ` +
            `Check that the images folder exists and the repository is public.`
        );
    }

    const files = await response.json();

    if (!Array.isArray(files)) {
        throw new Error("The GitHub images folder could not be read.");
    }

    const imageFiles = files
        .filter(file =>
            file.type === "file" &&
            CONFIG.supportedExtensions.some(extension =>
                file.name.toLowerCase().endsWith(extension)
            )
        )
        .sort((a, b) =>
            a.name.localeCompare(b.name, undefined, {
                numeric: true,
                sensitivity: "base"
            })
        );

    if (imageFiles.length === 0) {
        throw new Error("No supported images were found.");
    }

    /*
        Use the raw GitHub URL rather than the API download_url.
        This keeps the slideshow URL stable and avoids relying on
        temporary download URLs.
    */
    return imageFiles.map(file =>
        `https://raw.githubusercontent.com/` +
        `${encodeURIComponent(context.owner)}/` +
        `${encodeURIComponent(context.repo)}/` +
        `${encodeURIComponent(context.branch)}/` +
        `${file.path.split("/").map(encodeURIComponent).join("/")}`
    );
}


function showStatus(message) {
    statusElement.textContent = message;
    statusElement.classList.remove("hidden");
}


function hideStatus() {
    statusElement.classList.add("hidden");
}


function renderDots() {
    dots.innerHTML = "";

    // Don't create hundreds of dots if a very large image collection is used.
    if (images.length > 50) {
        return;
    }

    images.forEach((_, index) => {
        const dot = document.createElement("button");

        dot.className = "dot";
        dot.type = "button";
        dot.setAttribute("aria-label", `Show image ${index + 1}`);

        dot.addEventListener("click", () => {
            showImage(index);
            restartTimer();
        });

        dots.appendChild(dot);
    });
}


function updateDots() {
    const dotElements = dots.querySelectorAll(".dot");

    dotElements.forEach((dot, index) => {
        dot.classList.toggle("active", index === currentIndex);
    });
}


function showImage(index) {
    if (!images.length) return;

    currentIndex =
        (index + images.length) % images.length;

    imageElement.classList.remove("loaded");

    imageElement.onload = () => {
        imageElement.classList.add("loaded");
    };

    imageElement.src = images[currentIndex];
    imageElement.alt = `Image ${currentIndex + 1} of ${images.length}`;

    counter.textContent =
        `${currentIndex + 1} / ${images.length}`;

    updateDots();
}


function nextImage() {
    showImage(currentIndex + 1);
}


function previousImage() {
    showImage(currentIndex - 1);
}


function updatePlayButton() {
    playButton.textContent = playing ? "❚❚" : "▶";
    playButton.setAttribute(
        "aria-label",
        playing ? "Pause slideshow" : "Play slideshow"
    );
}


function startTimer() {
    clearInterval(timer);

    if (!playing || images.length <= 1) return;

    timer = setInterval(nextImage, CONFIG.slideDuration);
}


function stopTimer() {
    clearInterval(timer);
    timer = null;
}


function restartTimer() {
    stopTimer();
    startTimer();
}


playButton.addEventListener("click", () => {
    playing = !playing;
    updatePlayButton();

    if (playing) {
        startTimer();
    } else {
        stopTimer();
    }
});


nextButton.addEventListener("click", () => {
    nextImage();
    restartTimer();
});


previousButton.addEventListener("click", () => {
    previousImage();
    restartTimer();
});


document.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") {
        nextImage();
        restartTimer();
    }

    if (event.key === "ArrowLeft") {
        previousImage();
        restartTimer();
    }

    if (event.key === " ") {
        event.preventDefault();
        playButton.click();
    }
});


slideshow.addEventListener("touchstart", event => {
    touchStartX = event.touches[0].clientX;
}, { passive: true });


slideshow.addEventListener("touchend", event => {
    if (touchStartX === null) return;

    const touchEndX = event.changedTouches[0].clientX;
    const difference = touchEndX - touchStartX;

    touchStartX = null;

    if (Math.abs(difference) < 40) return;

    if (difference < 0) {
        nextImage();
    } else {
        previousImage();
    }

    restartTimer();
}, { passive: true });


async function init() {
    try {
        images = await loadImagesFromGitHub();

        renderDots();
        showImage(0);
        hideStatus();
        updatePlayButton();
        startTimer();

    } catch (error) {
        console.error(error);

        showStatus(
            "Unable to load slideshow images. " +
            error.message
        );

        previousButton.style.display = "none";
        nextButton.style.display = "none";
        playButton.style.display = "none";
        counter.style.display = "none";
        dots.style.display = "none";
    }
}


init();
</script>

</body>
</html>
