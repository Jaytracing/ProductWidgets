<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reusable Image Comparison</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial,sans-serif;
}

.comparison{

    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    touch-action:none;
    user-select:none;

    background:#eee;
}

/* BOTH IMAGES ARE IDENTICAL */

.after,
.before{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    pointer-events:none;
}

/* Only this container changes width */

.before-wrapper{

    position:absolute;

    top:0;
    left:0;

    width:50%;
    height:100%;

    overflow:hidden;
}

/* IMPORTANT:
   The image stays full width.
   It is positioned relative to the comparison container,
   not the wrapper.
*/

.before{

    position:absolute;

    left:0;
    top:0;

    width:100vw;
    height:100%;

    object-fit:cover;
}

/* Slider */

.slider{

    position:absolute;

    top:0;
    left:50%;

    width:0;
    height:100%;

    cursor:ew-resize;

    z-index:20;
}

.slider-line{

    position:absolute;

    left:0;

    width:2px;

    height:100%;

    background:white;

    transform:translateX(-1px);

    box-shadow:0 0 12px rgba(0,0,0,.25);
}

.slider-button{

    position:absolute;

    left:0;
    top:50%;

    transform:translate(-50%,-50%);

    width:58px;
    height:58px;

    border-radius:50%;

    background:white;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:24px;
    font-weight:bold;

    box-shadow:0 8px 24px rgba(0,0,0,.3);
}

/* Labels */

.label{

    position:absolute;

    top:20px;

    padding:10px 18px;

    border-radius:999px;

    color:white;

    background:rgba(0,0,0,.55);

    font-weight:bold;

    backdrop-filter:blur(10px);

    z-index:30;
}

.before-label{

    left:20px;
}

.after-label{

    right:20px;
}

</style>

</head>

<body>

<div class="comparison" id="comparison">

    <img class="after">

    <div class="before-wrapper">

        <img class="before">

    </div>

    <div class="slider">

        <div class="slider-line"></div>

        <div class="slider-button">↔</div>

    </div>

    <div class="label before-label"></div>
    <div class="label after-label"></div>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const beforeImage=params.get("before") || "before.jpg";
const afterImage=params.get("after") || "after.jpg";

const beforeLabel=params.get("beforeLabel") || "Before";
const afterLabel=params.get("afterLabel") || "After";

const start=parseFloat(params.get("start")) || 50;

const fit=params.get("fit") || "cover";

const comparison=document.getElementById("comparison");

const before=document.querySelector(".before");

const after=document.querySelector(".after");

const wrapper=document.querySelector(".before-wrapper");

const slider=document.querySelector(".slider");

before.src="images/"+beforeImage;
after.src="images/"+afterImage;

before.style.objectFit=fit;
after.style.objectFit=fit;

document.querySelector(".before-label").textContent=beforeLabel;
document.querySelector(".after-label").textContent=afterLabel;

function setPosition(percent){

    percent=Math.max(0,Math.min(100,percent));

    wrapper.style.width=percent+"%";

    slider.style.left=percent+"%";

}

setPosition(start);

let dragging=false;

function update(clientX){

    const rect=comparison.getBoundingClientRect();

    let x=clientX-rect.left;

    x=Math.max(0,Math.min(rect.width,x));

    setPosition((x/rect.width)*100);

}

comparison.addEventListener("mousedown",(e)=>{

    dragging=true;

    update(e.clientX);

});

window.addEventListener("mousemove",(e)=>{

    if(!dragging)return;

    update(e.clientX);

});

window.addEventListener("mouseup",()=>{

    dragging=false;

});

comparison.addEventListener("touchstart",(e)=>{

    dragging=true;

    update(e.touches[0].clientX);

});

window.addEventListener("touchmove",(e)=>{

    if(!dragging)return;

    update(e.touches[0].clientX);

},{passive:false});

window.addEventListener("touchend",()=>{

    dragging=false;

});

</script>

</body>
</html>
